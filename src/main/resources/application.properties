# ==============================================================================
# HTTP Server
# ==============================================================================
quarkus.http.port=8081

# ==============================================================================
# CORS
# ==============================================================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8081
quarkus.http.cors.headers=Authorization,Content-Type

# ==============================================================================
# Security / JWT (validation only)
# ==============================================================================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=orion-users

# Public paths — protected endpoints use @RolesAllowed("user")
quarkus.http.auth.permission.public.paths=/,/assets/*,/components/*,/services/*,/stores/*,/router/*,/webhook/*,/ai/ask,/ai/context,/mcp/*
quarkus.http.auth.permission.public.policy=permit

# ==============================================================================
# Database — PostgreSQL + PGVector (Dev Services)
# ==============================================================================
# Dev Services automatically starts a PostgreSQL+PGVector container when Docker is available.
# Uncomment the lines below only if you want to use an external PostgreSQL instance.
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rag_db
# quarkus.datasource.reactive.url=postgresql://localhost:5432/rag_db

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus
quarkus.datasource.devservices.port=5432
%test.quarkus.datasource.devservices.port=5433
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17

# Flyway manages the schema — Hibernate must not interfere
quarkus.hibernate-orm.schema-management.strategy=none

# ==============================================================================
# Flyway (migrations)
# ==============================================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# Automatically repair failed migrations in development
quarkus.flyway.repair-at-start=true

# ==============================================================================
# Redis (cache)
# ==============================================================================
quarkus.redis.devservices.enabled=true

# ==============================================================================
# OpenAI / LangChain4j
# ==============================================================================
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:change-me}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=PT60S
quarkus.langchain4j.embedding-model.provider=openai
quarkus.langchain4j.pgvector.dimension=1536

# ==============================================================================
# RAG — Retrieval-Augmented Generation
# ==============================================================================
rag.location=src/main/resources/rag
rag.context=JavaScript

# Scrape debug — when true, each scraped URL is saved as .md for inspection
rag.scrape.save-markdown=true
rag.scrape.save-markdown.dir=target/scraped-markdown
# rag.scrape.timeout-seconds=30
# rag.scrape.user-agent=RAG-Scraper/1.0

# URLs to fetch and ingest at startup (comma-separated)
rag.scrape.urls=https://cpw2.rpmhub.dev/introducao/introducao.html,\
  https://cpw2.rpmhub.dev/introducao/intro/content.md,\
  https://cpw2.rpmhub.dev/variaveis/variaveis.html,\
  https://cpw2.rpmhub.dev/variaveis/slides/content.md,\
  https://cpw2.rpmhub.dev/tipos/tipos.html,\
  https://cpw2.rpmhub.dev/tipos/slides/content.md,\
  https://cpw2.rpmhub.dev/operadores/operadores.html,\
  https://cpw2.rpmhub.dev/operadores/slides/content.md,\
  https://cpw2.rpmhub.dev/controle/controle.html,\
  https://cpw2.rpmhub.dev/controle/slides/content.md,\
  https://cpw2.rpmhub.dev/funcoes/funcoes.html,\
  https://cpw2.rpmhub.dev/funcoes/slides/content.md,\
  https://cpw2.rpmhub.dev/eventos/eventos.html,\
  https://cpw2.rpmhub.dev/eventos/slides/content.md,\
  https://cpw2.rpmhub.dev/dom/dom.html,\
  https://cpw2.rpmhub.dev/dom/slides/content.md,\
  https://cpw2.rpmhub.dev/ajax/ajax.html,\
  https://cpw2.rpmhub.dev/ajax/slides/content.md,\
  https://cpw2.rpmhub.dev/exercicios/domAjax.html

# ==============================================================================
# Memory Management
# ==============================================================================
memory.default.max-messages=100
memory.ttl.hours=48

# ==============================================================================
# WhatsApp Cloud API — Meta (optional)
# ==============================================================================
# If not configured, only the web interface will be used.
# Set WHATSAPP_PHONE_NUMBER_ID and WHATSAPP_ACCESS_TOKEN in the .env file.
whatsapp.verify-token=rag-webhook-verify
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# ==============================================================================
# Orion Users (external authentication service)
# ==============================================================================
orion.users.url=http://localhost:8080

# ==============================================================================
# Production profile (Fly.io / JVM)
# ==============================================================================
%prod.quarkus.http.port=8080
%prod.quarkus.datasource.devservices.enabled=false
%prod.quarkus.redis.devservices.enabled=false
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:quarkus}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:quarkus}
%prod.quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS}
%prod.rag.location=${RAG_LOCATION:/work/rag}
