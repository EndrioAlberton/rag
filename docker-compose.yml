name: orion

# PostgreSQL (pgvector) and Redis use public images from Docker Hub.
# The Quarkus app is built from the Dockerfile at the repository root.
#
# Environment: copy .env.example to .env and edit. Compose loads .env automatically.
# .env is not copied into the Docker image (see .dockerignore).
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#   # App: http://localhost (host port defaults to 80; JVM listens on 8080 inside the container)
#
services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${RAG_HOST_PORT:-80}:8080"
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env or the environment}
      QUARKUS_DATASOURCE_JDBC_URL: ${QUARKUS_DATASOURCE_JDBC_URL:-jdbc:postgresql://postgres:5432/orion_rag}
      QUARKUS_DATASOURCE_REACTIVE_URL: ${QUARKUS_DATASOURCE_REACTIVE_URL:-postgresql://postgres:5432/orion_rag}
      QUARKUS_DATASOURCE_USERNAME: ${QUARKUS_DATASOURCE_USERNAME:-orion}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:-orion}
      QUARKUS_REDIS_HOSTS: ${QUARKUS_REDIS_HOSTS:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion}
      POSTGRES_DB: ${POSTGRES_DB:-orion_rag}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-orion} -d ${POSTGRES_DB:-orion_rag}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
