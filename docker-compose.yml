name: orion

# PostgreSQL (pgvector) and Redis use public images from Docker Hub.
# The Quarkus app is built from the Dockerfile at the repository root.
#
# Environment: copy .env.example to .env and edit. Compose loads .env automatically.
# .env is not copied into the Docker image (see .dockerignore).
#
# Startup order (same POSTGRES_DB for RAG + Orion Users):
#   postgres + redis → rag (Flyway migra primeiro) → orion-users (Hibernate/import.sql).
# O serviço "rag" expõe /q/health/ready; orion-users só arranca depois do healthcheck OK.
# Em prod o RAG usa Flyway baseline-on-migrate (application.properties) se o schema já tiver
# tabelas do Orion Users sem histórico Flyway — evita falha ao migrar.
#
# Quick start:
#   cp .env.example .env
#   ./config/scripts/docker-compose-up.sh
#   # ou: docker compose up --build
#   # RAG: http://localhost (host port defaults to 80; JVM listens on 8080 inside the container)
#   # Orion Users (auth): http://localhost:8080 (same PostgreSQL database as RAG: POSTGRES_DB)
#
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion}
      POSTGRES_DB: ${POSTGRES_DB:-orion_rag}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-orion} -d ${POSTGRES_DB:-orion_rag}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${RAG_HOST_PORT:-80}:8080"
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env or the environment}
      QUARKUS_DATASOURCE_JDBC_URL: ${QUARKUS_DATASOURCE_JDBC_URL:-jdbc:postgresql://postgres:5432/orion_rag}
      QUARKUS_DATASOURCE_REACTIVE_URL: ${QUARKUS_DATASOURCE_REACTIVE_URL:-postgresql://postgres:5432/orion_rag}
      QUARKUS_DATASOURCE_USERNAME: ${QUARKUS_DATASOURCE_USERNAME:-orion}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:-orion}
      QUARKUS_REDIS_HOSTS: ${QUARKUS_REDIS_HOSTS:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  orion-users:
    build:
      context: https://github.com/orion-services/users.git#main
    ports:
      - "${ORION_USERS_HOST_PORT:-8080}:8080"
    environment:
      QUARKUS_DEVSERVICES_ENABLED: "false"
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://${POSTGRES_USER:-orion}:${POSTGRES_PASSWORD:-orion}@postgres:5432/${POSTGRES_DB:-orion_rag}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-orion}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orion}
      QUARKUS_MAILER_MOCK: "${QUARKUS_MAILER_MOCK:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
